<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Blog Post — Craig Mzumara</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231c1c22'/><text x='50' y='65' font-family='sans-serif' font-size='45' font-weight='bold' fill='%23ffe600' text-anchor='middle'>CM</text></svg>">

  <meta name="description" id="meta-description" content="Blog Post by Craig Mzumara" />
  <meta property="og:title" id="og-title" content="Blog Post" />
  <meta property="og:description" id="og-description" content="Blog Post by Craig Mzumara" />
  <meta property="og:image" id="og-image" content="/og-default.png" />
  <meta property="og:type" content="article" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="stylesheet" href="/style.css" />

  <!-- Prevent White Screen Flash on Load (Defaulting to Dark Theme) -->
  <script>
    (function() {
      const theme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <!-- Root-Relative Favicon Path -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">

  <style>
    .post-container {
      max-width: 860px;
      margin: 60px auto 80px auto;
      display: flex;
      flex-direction: column;
      gap: 28px;
      padding: 0 20px;
    }
    .post-breadcrumbs {
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .post-breadcrumbs a {
      color: var(--text-muted);
      text-decoration: none;
    }
    .post-hero {
      display: grid;
      grid-template-columns: 1fr;
      gap: 22px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.12);
    }
    .post-meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .post-meta-row span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .post-meta-pill {
      padding: 10px 16px;
      background: rgba(255, 230, 0, 0.08);
      border-radius: 999px;
      color: var(--yellow-primary);
      font-weight: 700;
    }
    .post-title {
      font-size: clamp(2rem, 2.4vw, 3.2rem);
      line-height: 1.03;
      letter-spacing: -0.04em;
      color: var(--yellow-primary);
      margin-bottom: 0;
    }
    .post-image-wrap {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 24px;
      background: var(--bg-surface);
      min-height: 320px;
    }
    .post-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.55s ease, transform 0.55s ease, filter 0.55s ease;
      filter: blur(16px);
    }
    .post-image-wrap img.loaded {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }
    .post-body {
      color: var(--text-main);
      line-height: 1.85;
      font-size: 1rem;
      white-space: pre-line;
      letter-spacing: 0.01em;
      padding: 0 2px;
    }
    .post-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 10px;
    }
    .post-actions button,
    .post-actions a {
      border-radius: 999px;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-main);
      padding: 12px 18px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: var(--transition);
    }
    .post-actions button:hover,
    .post-actions a:hover {
      border-color: var(--yellow-primary);
      color: var(--yellow-primary);
    }
    .post-comments {
      display: grid;
      gap: 18px;
      padding: 24px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 28px;
    }
    .comments-header {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .comments-list {
      display: grid;
      gap: 16px;
    }
    .comment-item {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 18px 20px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }
    .comment-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 10px;
    }
    .comment-body {
      color: var(--text-main);
      line-height: 1.75;
    }
    .post-comment-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .post-comment-form input,
    .post-comment-form textarea {
      width: 100%;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-main);
      padding: 14px 16px;
      border-radius: 18px;
      font-size: 0.95rem;
      resize: vertical;
    }
    .post-comment-form textarea {
      min-height: 120px;
    }
    .post-comment-form button {
      align-self: flex-start;
    }
    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(28, 28, 34, 0.95);
      color: var(--yellow-primary);
      padding: 12px 18px;
      border-radius: 999px;
      border: 1px solid var(--yellow-primary);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .toast.show {
      opacity: 1;
    }
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }
    .modal-overlay.active {
      display: flex;
    }
  </style>
</head>
<body>
  <div class="bg-glow floating-glow"></div>
  <div class="bg-glow-secondary floating-glow-delay"></div>

  <header class="navbar-wrapper">
    <div class="container">
      <nav class="navbar">
        <a href="/index.html" class="brand-logo">
          <div class="logo-mark">CM</div>
          <div class="brand-name">CRAIG <span>MZUMARA</span></div>
        </a>
        <ul class="nav-links">
          <li><a href="/index.html#home" class="nav-link">Home</a></li>
          <li><a href="/index.html#about" class="nav-link">About</a></li>
          <li><a href="/index.html#projects" class="nav-link">Projects</a></li>
          <li><a href="/index.html#photography" class="nav-link">Photography</a></li>
          <li><a href="/blog.html" class="nav-link active">Blog Feed</a></li>
        </ul>
        <div class="nav-actions">
          <a href="/blog.html" class="cta-btn-nav">Back to Feed</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="post-container">
    <div class="post-breadcrumbs">
      <a href="/blog.html">Blog</a>
      <span>•</span>
      <span>Full Post</span>
    </div>

    <section class="post-hero">
      <div class="post-meta-row">
        <span class="post-meta-pill" id="post-date">Loading date...</span>
        <span>Likes: <strong id="post-like-count">0</strong></span>
        <span>Comments: <strong id="post-comment-count">0</strong></span>
      </div>
      <h1 class="post-title" id="post-title">Loading post...</h1>
      <div class="post-image-wrap" id="post-image-container" style="display: none;">
        <img id="post-image" src="" alt="" loading="lazy" decoding="async" class="loaded-image" />
      </div>
      <div class="post-body" id="post-body">Fetching post details...</div>
      <div class="post-actions">
        <button id="share-btn">Share this post</button>
        <button id="toggle-comments-btn">Show Comments</button>
        <a href="/blog.html">Back to feed</a>
      </div>
    </section>

    <section class="post-comments" id="post-comments-section">
      <div class="comments-header">
        <div>
          <h2 style="margin:0;">Comments</h2>
          <p style="margin:4px 0 0 0; color: var(--text-muted);">Join the conversation below.</p>
        </div>
      </div>
      <div class="comments-list" id="comments-list"></div>
      <form class="post-comment-form" id="post-comment-form">
        <input id="comment-author-input" type="text" placeholder="Your name" />
        <textarea id="comment-textarea" placeholder="Write your comment..."></textarea>
        <button type="submit" class="btn-send-comment">Post Comment</button>
      </form>
    </section>
  </main>

  <div id="toast" class="toast" role="alert">Link copied to clipboard!</div>

  <script>
    // Get post ID from URL parameter (e.g. /post.html?id=6)
    const urlParams = new URLSearchParams(window.location.search);
    const POST_ID = urlParams.get('id');

    window.API_BASE_URL = window.API_BASE_URL || (
  window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
    ? 'http://localhost:3000'
    : 'https://craigmzumara-production.up.railway.app'
);

    document.addEventListener('DOMContentLoaded', async () => {
      if (!POST_ID) {
        document.getElementById('post-title').textContent = 'Post Not Found';
        document.getElementById('post-body').textContent = 'No post ID provided in the URL.';
        return;
      }

      const shareBtn = document.getElementById('share-btn');
      const commentsSection = document.getElementById('post-comments-section');
      const commentForm = document.getElementById('post-comment-form');
      const toggleCommentsBtn = document.getElementById('toggle-comments-btn');
      const storedName = localStorage.getItem('visitor_name');
      const authorInput = document.getElementById('comment-author-input');

      if (storedName) {
        authorInput.value = storedName;
      }

      shareBtn.addEventListener('click', () => sharePost());
      toggleCommentsBtn.addEventListener('click', () => {
        commentsSection.classList.toggle('open');
      });

      commentForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const name = authorInput.value.trim();
        const commentText = document.getElementById('comment-textarea').value.trim();
        if (!name || !commentText) return;
        localStorage.setItem('visitor_name', name);

        try {
          const res = await fetch(`${API_BASE_URL}/api/blog/posts/${POST_ID}/comments`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ author_name: name, comment_text: commentText })
          });
          const result = await res.json();
          if (result.success) {
            document.getElementById('comment-textarea').value = '';
            loadComments();
            document.getElementById('post-comment-count').textContent = result.comment_count || document.getElementById('post-comment-count').textContent;
          }
        } catch (err) {
          console.error(err);
        }
      });

      await loadPostData();
      loadComments();
    });

    async function loadPostData() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/blog/posts/${POST_ID}`);
        if (!res.ok) {
          document.getElementById('post-title').textContent = 'Post Not Found';
          document.getElementById('post-body').textContent = 'The requested blog post could not be loaded.';
          return;
        }

        const post = await res.json();

        // Update DOM Content
        document.getElementById('post-title').textContent = post.title || 'Untitled Post';
        document.getElementById('page-title').textContent = `${post.title || 'Blog Post'} — Craig Mzumara`;
        document.getElementById('post-body').textContent = post.content || '';
        document.getElementById('post-date').textContent = `Posted on ${new Date(post.created_at).toLocaleDateString()}`;
        document.getElementById('post-like-count').textContent = post.like_count != null ? post.like_count : '0';
        document.getElementById('post-comment-count').textContent = post.comment_count != null ? post.comment_count : '0';

        // Handle Image loading
        const imageContainer = document.getElementById('post-image-container');
        const heroImage = document.getElementById('post-image');
        if (post.image_url) {
          heroImage.src = post.image_url;
          heroImage.alt = post.title || 'Blog Image';
          imageContainer.style.display = 'block';
          if (heroImage.complete) {
            heroImage.classList.add('loaded');
          } else {
            heroImage.addEventListener('load', () => heroImage.classList.add('loaded'));
          }
        } else {
          imageContainer.style.display = 'none';
        }
      } catch (err) {
        console.error('Failed to load post data:', err);
        document.getElementById('post-title').textContent = 'Error Loading Post';
        document.getElementById('post-body').textContent = 'Failed to connect to backend server.';
      }
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2800);
    }

    function sharePost() {
      const url = `${window.location.origin}/post.html?id=${POST_ID}`;
      const title = document.getElementById('post-title').textContent || 'Craig Mzumara Post';
      if (navigator.share) {
        navigator.share({ title, url }).catch(() => {});
        return;
      }
      navigator.clipboard.writeText(url).then(() => showToast('Link copied to clipboard!'));
    }

    async function loadComments() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/blog/posts/${POST_ID}/comments`);
        const comments = await res.json();
        const list = document.getElementById('comments-list');
        list.innerHTML = comments.length ? comments.map(comment => `
          <div class="comment-item">
            <div class="comment-meta">
              <span>${comment.author_name}</span>
              <span>${new Date(comment.created_at).toLocaleDateString()}</span>
            </div>
            <div class="comment-body">${comment.comment_text}</div>
          </div>
        `).join('') : '<p style="color: var(--text-muted);">Be the first to leave a comment.</p>';
      } catch (err) {
        console.error(err);
      }
    }
  </script>
</body>
</html>
